apiVersion: v1
kind: ConfigMap
metadata:
  name: mafiabotfather-config
  namespace: mafiabotfather
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://mafiabotfather.uz"
  REDIS_URL: "redis://redis-service.mafiabotfather.svc.cluster.local:6379/0"
  CELERY_BROKER_URL: "redis://redis-service.mafiabotfather.svc.cluster.local:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service.mafiabotfather.svc.cluster.local:6379/0"
  DEFAULT_USD_TO_UZS_RATE: "12800"
