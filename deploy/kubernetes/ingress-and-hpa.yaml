apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mafiabotfather-ingress
  namespace: mafiabotfather
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.mafiabotfather.uz
        - api.mafiabotfather.uz
      secretName: mafiabotfather-tls
  rules:
    - host: app.mafiabotfather.uz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
    - host: api.mafiabotfather.uz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: mafiabotfather
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mafiabotfather-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
