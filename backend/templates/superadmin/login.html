<!DOCTYPE html>
<html lang="uz" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAdmin Kirish — Mafia Bot Father</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #090a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #12141d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 36px;
        }
        .form-control {
            background: #090a0f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
        }
        .form-control:focus {
            background: #090a0f;
            border-color: #e50914;
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2);
            color: #fff;
        }
        .btn-login {
            background: #e50914;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .btn-login:hover {
            background: #c40811;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <span class="fs-1">👑</span>
            <h4 class="fw-bold text-white mt-2 mb-1">MAFIA BOT FATHER</h4>
            <p class="text-secondary small">SuperAdmin Paneliga Kirish</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 small mb-3">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-secondary small fw-medium">Login yoki Email</label>
                <input type="text" name="username" class="form-control" placeholder="Login yoki email" required autofocus autocomplete="off">
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-medium">Parol</label>
                <input type="password" name="password" class="form-control" placeholder="Parol" required autocomplete="off">
            </div>

            <button type="submit" class="btn btn-login btn-danger w-100 text-white">
                <i class="fa-solid fa-lock me-2"></i> Tizimga Kirish
            </button>
        </form>
    </div>
</body>
</html>
