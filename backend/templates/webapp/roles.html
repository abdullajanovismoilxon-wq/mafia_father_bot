<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafia Rollar Katalogi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            min-height: 100vh;
            padding-bottom: 40px;
        }
        .header {
            padding: 20px 20px 10px 20px;
        }
        .header-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .header-icon {
            font-size: 28px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #0F172A;
        }
        .subtitle {
            font-size: 13px;
            color: #64748B;
            font-weight: 500;
            margin-bottom: 14px;
        }

        /* Search Bar */
        .search-box {
            position: relative;
            margin-bottom: 16px;
        }
        .search-input {
            width: 100%;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 14px;
            padding: 12px 16px 12px 42px;
            font-size: 15px;
            color: #0F172A;
            outline: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: 0.2s;
        }
        .search-input:focus {
            border-color: #EF4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
            pointer-events: none;
        }

        /* Filter Tabs */
        .filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .filter-scroll::-webkit-scrollbar {
            display: none;
        }
        .pill-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #EDF2F7;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .pill-btn.active {
            background: #EF4444;
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
        }
        .pill-count {
            opacity: 0.85;
            font-weight: 700;
        }

        /* Roles List */
        .roles-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .role-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 18px;
            padding: 16px;
            display: flex;
            gap: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: 0.2s;
        }
        .role-card:active {
            transform: scale(0.98);
        }
        .role-avatar {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: #F1F5F9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
        }
        .role-content {
            flex: 1;
        }
        .role-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .role-name {
            font-size: 16px;
            font-weight: 700;
            color: #0F172A;
        }
        .badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge-mafia {
            background: #EF4444;
            color: #FFFFFF;
        }
        .badge-town {
            background: #3B82F6;
            color: #FFFFFF;
        }
        .badge-solo {
            background: #F59E0B;
            color: #FFFFFF;
        }
        .role-desc {
            font-size: 13px;
            color: #475569;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title-box">
            <span class="header-icon">🎭</span>
            <h1>Rollar</h1>
        </div>
        <div class="subtitle">Mafiya o'yinidagi barcha rollar va ularning qobiliyatlari</div>

        <!-- Search Bar -->
        <div class="search-box">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Rol nomini qidirish..." oninput="filterRoles()">
        </div>

        <!-- Filter Tabs -->
        <div class="filter-scroll">
            <button class="pill-btn active" onclick="setCategory('all', this)">
                Hammasi <span class="pill-count">{{ total_count }}</span>
            </button>
            <button class="pill-btn" onclick="setCategory('town', this)">
                🏛 Tinch aholi <span class="pill-count">{{ town_count }}</span>
            </button>
            <button class="pill-btn" onclick="setCategory('mafia', this)">
                🤵🏻 Mafia <span class="pill-count">{{ mafia_count }}</span>
            </button>
            <button class="pill-btn" onclick="setCategory('solo', this)">
                🃏 Yakka <span class="pill-count">{{ solo_count }}</span>
            </button>
        </div>

        <!-- Roles List -->
        <div class="roles-list" id="rolesContainer">
            {% for r in roles %}
            <div class="role-card" data-category="{{ r.category }}" data-name="{{ r.name|lower }}" data-desc="{{ r.description|lower }}">
                <div class="role-avatar">{{ r.icon }}</div>
                <div class="role-content">
                    <div class="role-top">
                        <div class="role-name">{{ r.name }}</div>
                        <span class="badge {{ r.category_badge }}">{{ r.category_label }}</span>
                    </div>
                    <div class="role-desc">{{ r.description }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let currentCategory = 'all';

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            filterRoles();
        }

        function filterRoles() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.role-card');

            cards.forEach(card => {
                const cat = card.getAttribute('data-category');
                const name = card.getAttribute('data-name');
                const desc = card.getAttribute('data-desc');

                const matchesCat = (currentCategory === 'all' || cat === currentCategory);
                const matchesSearch = (!query || name.includes(query) || desc.includes(query));

                if (matchesCat && matchesSearch) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
